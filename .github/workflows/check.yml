name: check

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Data is reproducible from the generator
        run: python3 gen_data.py --check
      - name: Diagnosis matches expected.txt
        run: ./run.sh
